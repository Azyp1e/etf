name: 更新行情快照

on:
  schedule:
    # UTC 07:35 = 北京时间 15:35，收盘后运行
    - cron: "35 7 * * 1-5"
  workflow_dispatch:
    inputs:
      share_days:
        description: "份额回填天数（首次填 400，日常留空）"
        required: false
        default: "10"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新份额历史（Tushare）
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "未配置 TUSHARE_TOKEN，跳过份额回填"
            exit 0
          fi
          python scripts/fetch_shares.py --days "${{ github.event.inputs.share_days || 10 }}"

      - name: 抓取行情并生成快照
        run: python scripts/update_data.py

      - name: 提交数据变化
        run: |
          if git diff --quiet -- data/snapshot.js data/shares_history.json; then
            echo "数据没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.js data/shares_history.json
          git commit -m "data: update $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push

      # GITHUB_TOKEN 推送的提交不会自动触发 Pages 构建，必须显式触发一次
      - name: 触发 Pages 重新构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --jq '.status'
